<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>Three.js 打靶</title>
<style>
body{margin:0;overflow:hidden;background:#111;font-family:sans-serif}
#crosshair{position:absolute;top:50%;left:50%;width:10px;height:10px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;pointer-events:none}
#hint{position:absolute;top:58%;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.7);padding:10px 18px;border-radius:6px;pointer-events:none}
#info{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,.7);padding:12px;border-radius:5px;line-height:1.6;pointer-events:none}
#info label{pointer-events:auto;cursor:pointer;text-decoration:underline;display:block}
#startBox{position:fixed;inset:0;background:rgba(10,12,20,.88);display:flex;align-items:center;justify-content:center;z-index:10;color:#fff}
#startBox .card{background:#1c2030;padding:28px 32px;border-radius:12px;min-width:260px}
#startBox h2{margin:0 0 8px}
#startBox label{display:block;margin:14px 0}
#startBox input{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:8px;border-radius:6px;border:1px solid #445;background:#0f1220;color:#fff;font-size:16px}
#startBox button{width:100%;padding:10px;border:0;border-radius:6px;background:#e8a317;color:#222;font-size:16px;font-weight:700;cursor:pointer}
#startBox select{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:8px;border-radius:6px;border:1px solid #445;background:#0f1220;color:#fff;font-size:16px}
#hp{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:240px;height:14px;background:rgba(0,0,0,.6);border-radius:7px;overflow:hidden;pointer-events:none}
#hpfill{height:100%;width:100%;background:#4cd964;transition:width .2s}
#dmg{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(transparent 40%,rgba(255,0,0,.75))}
#bar{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}
.slot{width:48px;height:48px;border:2px solid rgba(255,255,255,.35);border-radius:6px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.slot.on{border-color:#ffd34d;background:rgba(255,211,77,.25)}
.slot i{font-style:normal;font-size:18px;line-height:18px}.slot b{width:22px;height:14px;border-radius:3px;display:block}
</style></head><body>
<div id="crosshair"></div><div id="bar"></div><div id="hp"><div id="hpfill"></div></div><div id="dmg"></div><div id="hint">点击画面开始（Esc 退出鼠标锁定）</div>
<div id="startBox"><div class="card"><h2>🎯 多人打靶</h2>
<label>你的名字<input id="nameIn" maxlength="12" placeholder="玩家"></label>
<label>房间号（同房间的人一起玩，最多 4 人）<input id="roomIn" maxlength="16" placeholder="room1"></label>
<label>模式（以第一个进房间的人为准）<select id="modeSel"><option value="coop">合作打靶</option><option value="pvp">阵营对战（可互射）</option></select></label>
<label>头像（可选，会贴在你角色的脸上）<input id="avIn" type="file" accept="image/*"><img id="avPrev" hidden width="64" height="64" style="border-radius:50%;margin-top:6px;object-fit:cover"></label>
<label>地图（以第一个进房间的人为准）<select id="mapSel"><option value="">加载中…</option></select></label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="voiceChk" style="width:auto;display:inline-block;margin:0"> 加入语音聊天（需要麦克风，且要用 https 地址打开）</label>
<label>建筑保护（以第一个进房间的人为准；有存档的房间沿用存档）<select id="protSel"><option value="1">开：只能拆自己砌的</option><option value="0">关：所有人都能拆</option></select></label>
<label>每波怪物数量（1–10，同上）<input id="countIn" type="number" min="1" max="10" value="3"></label>
<button id="startBtn">开始游戏</button><div id="startMsg" style="margin-top:8px;color:#ffb4a8"></div></div></div>
<div id="info"><strong>鼠标</strong>转视角｜<strong>WASD</strong>移动｜<strong>空格</strong>跳跃｜<strong>1–9/滚轮</strong>换物品（枪、砖、木板、玻璃、石头、门、窗、镐子、飞机）｜<strong>E</strong>开关门｜飞机：<strong>W/S</strong>加减速 <strong>A/D</strong>转弯 鼠标控制俯仰｜<strong>左键</strong>开枪/砌/拆｜<strong>右键</strong>拆｜<strong>Z</strong>撤销上一块｜<strong>M</strong>静音全部声音｜<strong>V</strong>开/关麦克风<br>
玩家 <span id="pname">-</span>｜第 <span id="wave">1</span> 波｜剩余 <span id="left">3</span> 个<br>
手持 <span id="tool">枪</span>｜模式 <span id="mode">-</span><div id="sb"></div><div id="saved" style="font-size:12px;opacity:.8"></div><div id="voice" style="font-size:12px;margin-top:2px"></div><div id="fly" style="font-size:12px"></div>

<label>☁ 天空图片<input type="file" id="pSky" accept="image/*" hidden></label>
<label>🌱 地面图片<input type="file" id="pGround" accept="image/*" hidden></label>
<label>🎵 背景音乐<input type="file" id="pBgm" accept="audio/*" hidden></label>
<small>（选文件前先按 Esc）｜版本：立面贴片 v2</small></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let BOX_COUNT = 3;                       // 每波箱子数量，改成 N 即可
const $ = id => document.getElementById(id);
const sRGB = THREE.sRGBEncoding;

// ---------- 场景 ----------
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfe3ff, 30, 100);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 3, 12); camera.rotation.order = 'YXZ';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = sRGB;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(20, 40, 10); scene.add(sun);

const cvTex = (w, h, draw) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = sRGB; return t;
};

// 天空：程序生成（渐变 + 云 + 远山 + 太阳），可替换为你自己的全景图
const skyTex = cvTex(1024, 512, (x, w, h) => {
  let g = x.createLinearGradient(0, 0, 0, h / 2); g.addColorStop(0, '#1e5fa8'); g.addColorStop(1, '#bfe3ff');
  x.fillStyle = g; x.fillRect(0, 0, w, h / 2);
  x.fillStyle = '#8fb878'; x.fillRect(0, h / 2, w, h / 2);
  for (let i = 0; i < 60; i++) {
    x.fillStyle = `rgba(255,255,255,${.15 + Math.random() * .3})`; x.beginPath();
    x.ellipse(Math.random() * w, 20 + Math.random() * h * .3, 30 + Math.random() * 60, 8 + Math.random() * 14, 0, 0, 7); x.fill();
  }
  x.fillStyle = '#6f8fb5'; x.beginPath(); x.moveTo(0, h / 2);
  for (let i = 0; i <= w; i += 32) x.lineTo(i, h / 2 - 10 - Math.random() * 40);
  x.lineTo(w, h / 2); x.fill();
  const s = x.createRadialGradient(760, 90, 5, 760, 90, 60);
  s.addColorStop(0, '#fff'); s.addColorStop(.3, 'rgba(255,240,180,.9)'); s.addColorStop(1, 'rgba(255,240,180,0)');
  x.fillStyle = s; x.fillRect(680, 10, 160, 160);
});
const skyGeo = new THREE.SphereGeometry(200, 40, 20); skyGeo.scale(-1, 1, 1);
const skyMat = new THREE.MeshBasicMaterial({ map: skyTex, fog: false });
const sky = new THREE.Mesh(skyGeo, skyMat); scene.add(sky);

// 地面：程序生成草地，可替换
const grassTex = cvTex(256, 256, (x, w, h) => {
  x.fillStyle = '#4f8a3c'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) {
    x.fillStyle = `hsl(${90 + Math.random() * 30},45%,${28 + Math.random() * 20}%)`;
    x.fillRect(Math.random() * w, Math.random() * h, 2, 3);
  }
});
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(60, 60);
const groundMat = new THREE.MeshStandardMaterial({ map: grassTex });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), groundMat);
ground.rotation.x = -Math.PI / 2; scene.add(ground);

// ---------- 枪（挂在相机下，随视角移动） ----------
const gun = new THREE.Group();
const gunMat = new THREE.MeshStandardMaterial({ color: 0x2b2f36, metalness: .6, roughness: .4 });
const part = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); gun.add(m); return m; };
part(new THREE.BoxGeometry(.09, .12, .5), gunMat, 0, 0, 0);                                   // 枪身
part(new THREE.CylinderGeometry(.025, .025, .35, 12), gunMat, 0, .02, -.4).rotation.x = Math.PI / 2;  // 枪管
part(new THREE.BoxGeometry(.07, .2, .09), new THREE.MeshStandardMaterial({ color: 0x4a3426 }), 0, -.15, .12).rotation.x = .25;  // 握把
part(new THREE.BoxGeometry(.03, .04, .05), gunMat, 0, .09, -.15);                             // 准星
const flash = part(new THREE.SphereGeometry(.07, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffd34d, fog: false }), 0, .02, -.6);
flash.visible = false;                                                                        // 枪口火光
const GUN_REST = new THREE.Vector3(.28, -.26, -.65);
gun.position.copy(GUN_REST);
camera.add(gun); scene.add(camera);
let recoil = 0, flashT = 0, bob = 0;

// ---------- 箱子（位置由服务器决定）、其他玩家、网络 ----------
const crateTex = cvTex(256, 256, x => {
  x.fillStyle = '#8b5a2b'; x.fillRect(0, 0, 256, 256);
  x.strokeStyle = '#5a3a1a'; x.lineWidth = 16; x.strokeRect(8, 8, 240, 240);
  x.beginPath(); x.moveTo(8, 8); x.lineTo(248, 248); x.moveTo(248, 8); x.lineTo(8, 248); x.stroke();
});
const mobs = new Map();                      // 怪物 id -> { g 模型, type, hp, max, alive, tgt 服务器给的最新位置, ... }
let ws = null, myTeam = 0, protectOn = true, myUid = '', myId = 0, mode = 'coop', myHp = 100, myAlive = true, wave = 0, leftN = 0, shots = 0;
const others = new Map(), TEAM_COL = [0x3aa0ff, 0xff5a4a];

function mm(o) { const m = new THREE.MeshStandardMaterial(o); m.userData.em = m.emissive.clone(); return m; }
function makeMob(b) {                         // 0 蝙蝠  1 幽灵  2 怪物
  const g = new THREE.Group(), mats = [];
  const M = o => { const m = mm(o); mats.push(m); return m; };
  const add = (geo, mat, x, y, z, parent = g) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };
  let anim;
  if (b.type === 0) {
    const fur = M({ color: 0x3a2a4a, roughness: .9 }), red = M({ color: 0xff2020, emissive: 0xaa0000 });
    add(new THREE.SphereGeometry(.38, 12, 10), fur, 0, 0, 0).scale.set(1, .9, 1.25);              // 身体
    add(new THREE.SphereGeometry(.26, 12, 10), fur, 0, .2, -.42);                                  // 头
    [-.12, .12].forEach(x => { add(new THREE.ConeGeometry(.08, .28, 6), fur, x, .5, -.42); add(new THREE.SphereGeometry(.045, 6, 6), red, x, .24, -.64); });   // 耳朵、红眼
    const wingMat = M({ color: 0x2a1c38, side: THREE.DoubleSide, roughness: 1 });
    const wings = [-1, 1].map(sg => { const w = new THREE.Group(); g.add(w); add(new THREE.PlaneGeometry(1.5, .7), wingMat, sg * .75, 0, 0, w).rotation.x = -Math.PI / 2; return w; });
    anim = T => { const a = Math.sin(T * 20 + b.id) * .8; wings[0].rotation.z = a; wings[1].rotation.z = -a; };     // 扇翅膀
  } else if (b.type === 1) {
    const ghostMat = () => M({ color: 0xeaf2ff, emissive: 0x4466aa, emissiveIntensity: .5, transparent: true, opacity: .72, side: THREE.DoubleSide });
    const pts = [[0, 1.7], [.35, 1.65], [.62, 1.4], [.72, 1.0], [.78, .5], [.9, 0]].map(([x, y]) => new THREE.Vector2(x, y));
    add(new THREE.LatheGeometry(pts, 16), ghostMat(), 0, -.85, 0);                                // 飘逸的身体
    const dark = M({ color: 0x050510 });
    [-.25, .25].forEach(x => add(new THREE.SphereGeometry(.13, 10, 10), dark, x, .35, -.66).scale.set(.8, 1.3, .5));   // 黑洞眼睛
    add(new THREE.SphereGeometry(.14, 10, 10), dark, 0, -.05, -.7).scale.set(1.1, 1.5, .5);        // 嘴
    [-1, 1].forEach(sg => add(new THREE.SphereGeometry(.18, 8, 8), ghostMat(), sg * .85, -.1, -.1).scale.set(.7, 1.5, .7));   // 手臂
    anim = T => { g.rotation.z = Math.sin(T * 2 + b.id) * .08; };                                  // 左右轻晃
  } else {
    const skin = M({ color: 0x4f7a3a, roughness: .9 }), dark = M({ color: 0x2c4a22 }), horn = M({ color: 0xe8e0c0 }), eye = M({ color: 0xffe14a, emissive: 0xffaa00 });
    add(new THREE.SphereGeometry(.8, 14, 12), skin, 0, .55, 0).scale.set(1.1, 1.15, .9);          // 身体
    add(new THREE.SphereGeometry(.5, 14, 12), skin, 0, 1.55, -.1);                                 // 头
    [-.28, .28].forEach(x => { add(new THREE.ConeGeometry(.12, .5, 8), horn, x, 2.0, -.1).rotation.z = -x * 1.2; add(new THREE.SphereGeometry(.09, 8, 8), eye, x * .75, 1.62, -.55); });   // 角、黄眼
    add(new THREE.BoxGeometry(.5, .12, .08), M({ color: 0x220808 }), 0, 1.35, -.55);               // 嘴
    const limb = (sg, y, len, rad, mat) => { const a = new THREE.Group(); a.position.set(sg, y, 0); g.add(a); add(new THREE.CylinderGeometry(rad, rad * .85, len, 8), mat, 0, -len / 2, 0, a); return a; };
    const arms = [limb(-.95, 1.0, 1.1, .2, skin), limb(.95, 1.0, 1.1, .2, skin)], legs = [limb(-.4, -.25, .9, .25, dark), limb(.4, -.25, .9, .25, dark)];
    g.children.forEach(c => { c.position.y -= .3; });                                              // 让脚底刚好踩在地面
    anim = (T, v) => { const k = Math.min(1, v / 3), sw = Math.sin(T * 6) * .6 * k; arms[0].rotation.x = sw; arms[1].rotation.x = -sw; legs[0].rotation.x = -sw; legs[1].rotation.x = sw; };
  }
  const bar = new THREE.Group(); bar.position.y = b.type === 0 ? .9 : b.type === 1 ? 1.4 : 2.4; bar.visible = false;      // 血条（受伤后才显示）
  const bg = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0x220000, depthTest: false, fog: false })); bg.scale.set(1.5, .16, 1);
  const fill = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0x44dd55, depthTest: false, fog: false })); fill.scale.set(1.4, .1, 1);
  bar.add(bg, fill); g.add(bar);
  return { g, type: b.type, hp: b.hp, max: b.max, alive: b.alive, mats, anim, bar, barFill: fill, tgt: null, flash: 0, dying: 0 };
}
function setBoxes(list) {                    // 新一波：清掉旧的，再按服务器给的类型和位置生成（函数名沿用）
  mobs.forEach(o => scene.remove(o.g)); mobs.clear();
  list.forEach(b => { const o = makeMob(b); o.g.position.set(b.x, b.y, b.z); o.g.rotation.y = b.ry; o.g.visible = b.alive; mobs.set(b.id, o); scene.add(o.g); });
  leftN = list.filter(b => b.alive).length; hud();
}
function applyMobs(list) { list.forEach(a => { const o = mobs.get(a[0]); if (o) o.tgt = a; }); }      // a = [id, x, y, z, 朝向]
function updateMobs(dt) {
  const T = performance.now() / 1000;
  mobs.forEach(o => {
    const g = o.g;
    if (o.dying > 0) { o.dying -= dt; g.scale.setScalar(Math.max(.01, o.dying / .35)); g.position.y += dt * 2; if (o.dying <= 0) g.visible = false; return; }   // 被消灭：缩小飘走
    if (!o.alive) return;
    const px = g.position.x, pz = g.position.z, t = o.tgt;
    if (t) { g.position.x += (t[1] - g.position.x) * .3; g.position.y += (t[2] - g.position.y) * .3; g.position.z += (t[3] - g.position.z) * .3; g.rotation.y = t[4]; }
    o.anim(T, Math.hypot(g.position.x - px, g.position.z - pz) / Math.max(dt, .001));
    o.flash = Math.max(0, o.flash - dt);                                                          // 被打中时闪红
    o.mats.forEach(m => { if (o.flash > 0) m.emissive.setRGB(.9, 0, 0); else m.emissive.copy(m.userData.em); });
    o.bar.visible = o.hp < o.max; o.barFill.scale.x = Math.max(.01, o.hp / o.max) * 1.4;
  });
}
function hud(players) {
  $('wave').textContent = wave; $('left').textContent = leftN;
  const f = $('hpfill'); f.style.width = myHp + '%'; f.style.background = myHp > 40 ? '#4cd964' : '#ff453a';
  if (!players) return;
  const sb = $('sb'); sb.textContent = '';
  [...players].sort((a, b) => b.score - a.score).forEach(p => {
    const d = document.createElement('div');
    d.textContent = (peers.get(p.id) && peers.get(p.id).speaking ? '🔊 ' : p.voice ? '🎤 ' : '') + p.name + '：' + p.score + (p.alive ? '' : '（阵亡）');     // textContent，名字不会被当成 HTML
    d.style.color = mode === 'pvp' ? (p.team ? '#ff8a7a' : '#7ac0ff') : '#fff';
    if (p.id === myId) d.style.fontWeight = '700';
    sb.appendChild(d);
  });
}
function nameTag(text) {
  const t = cvTex(256, 64, (x, w, h) => {
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, 0, w, h); x.fillStyle = '#fff';
    x.font = '32px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, h / 2);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, fog: false, depthTest: false }));
  s.scale.set(2, .5, 1); s.position.y = 3.6; return s;
}
let avatars = {};                            // 玩家 id -> 头像 dataURL
const faceTex = cvTex(128, 128, (x, w, h) => {      // 默认脸：眼睛、眉毛、鼻子、嘴
  x.fillStyle = '#e0b08a'; x.fillRect(0, 0, w, h);
  const eye = cx => {
    x.fillStyle = '#fff'; x.beginPath(); x.ellipse(cx, 58, 11, 7, 0, 0, 7); x.fill();
    x.fillStyle = '#3b2a1e'; x.beginPath(); x.arc(cx, 58, 5, 0, 7); x.fill();
    x.strokeStyle = '#3a2615'; x.lineWidth = 4; x.beginPath(); x.moveTo(cx - 14, 44); x.lineTo(cx + 12, 42); x.stroke();
  };
  eye(40); eye(88);
  x.strokeStyle = '#b98763'; x.lineWidth = 3; x.beginPath(); x.moveTo(64, 62); x.lineTo(60, 82); x.lineTo(68, 84); x.stroke();
  x.strokeStyle = '#8a3b36'; x.lineWidth = 4; x.beginPath(); x.moveTo(46, 100); x.quadraticCurveTo(64, 110, 82, 100); x.stroke();
});
const std = c => new THREE.MeshStandardMaterial({ color: c, roughness: .85 });
const WOOD = std(0x7a5230), STEEL = std(0x9aa3ad);
const SKIN = std(0xe0b08a), HAIR = std(0x2b1d14), PANTS = std(0x2f3a52), SHOE = std(0x1c1c1c), SHIRT = TEAM_COL.map(std);
const G = {
  torso: new THREE.BoxGeometry(.95, 1.1, .5), leg: new THREE.CylinderGeometry(.17, .15, 1.3, 10), shoe: new THREE.BoxGeometry(.34, .16, .55),
  arm: new THREE.CylinderGeometry(.11, .1, .9, 10), hand: new THREE.SphereGeometry(.11, 8, 8), neck: new THREE.CylinderGeometry(.12, .13, .2, 10),
  head: new THREE.SphereGeometry(.38, 20, 16), hair: new THREE.SphereGeometry(.38 * 1.03, 18, 12, 0, Math.PI * 2, 0, 1.45),
  face: new THREE.SphereGeometry(.38 * 1.05, 20, 16, 1.5 * Math.PI - .85, 1.7, .85, 1.5),     // 正对前方（-z）的球面罩，头像/默认脸贴在这里
  gun: new THREE.BoxGeometry(.1, .14, .8), handle: new THREE.CylinderGeometry(.03, .03, 1.3, 8), blade: new THREE.BoxGeometry(.26, .03, .34), pickHead: new THREE.BoxGeometry(.7, .05, .06)
};
function setFace(g, url) {
  new THREE.TextureLoader().load(url, t => { t.encoding = sRGB; const m = g.userData.face.material; m.map = t; m.needsUpdate = true; });
}
function makeOther(p) {
  const g = new THREE.Group(), shirt = SHIRT[p.team % 2];
  const add = (geo, mat, x, y, z, parent = g) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };
  add(G.torso, shirt, 0, 1.85, 0); add(G.neck, SKIN, 0, 2.5, 0);
  const legs = [-.22, .22].map(x => {        // 腿：以髋关节为轴，才能前后摆动
    const hip = new THREE.Group(); hip.position.set(x, 1.4, 0); g.add(hip);

  if (k === 'm') { muted = !muted; if (master) master.gain.value = muted ? 0 : 1; if (bgmEl) bgmEl.muted = muted; }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

const canvasEl = renderer.domElement, hint = $('hint');
const locked = () => document.pointerLockElement === canvasEl;
let noLock = !canvasEl.requestPointerLock, failCount = 0, dragging = false, dragDist = 0;
function look(dx, dy, s) { yaw -= dx * s; pitch = Math.max(-1.5, Math.min(1.5, pitch - dy * s)); }
function setNoLock() {
  noLock = true; hint.style.display = 'block';
  hint.textContent = '鼠标锁定不可用，已切换为：按住拖动转视角，单击开枪';
  setTimeout(() => { if (!locked()) hint.style.display = 'none'; }, 5000);
}
if (noLock) setNoLock();
canvasEl.addEventListener('click', () => {
  initAudio();
  if (noLock || locked()) return;
  try { const r = canvasEl.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (err) { setNoLock(); }
});
document.addEventListener('pointerlockchange', () => {
  if (locked()) { failCount = 0; hint.style.display = 'none'; }
  else {
    for (const k in keys) keys[k] = false;
    if (!noLock) { hint.style.display = 'block'; hint.textContent = '点击画面开始（Esc 退出鼠标锁定）'; }
  }
});
document.addEventListener('pointerlockerror', () => {
  if (++failCount >= 2) { setNoLock(); return; }
  hint.style.display = 'block'; hint.textContent = '锁定失败，请等 1 秒后再点一次';
});
addEventListener('mousemove', e => {
  if (locked()) look(e.movementX, e.movementY, 0.002);
  else if (dragging) { dragDist += Math.abs(e.movementX) + Math.abs(e.movementY); look(e.movementX, e.movementY, 0.005); }
});
addEventListener('mousedown', e => {
  initAudio();
  if (locked()) { if (e.button === 0) usePrimary(); else if (e.button === 2) buildAt('del'); }   // 左键：开枪/砌砖，右键：拆砖
  else if (e.button === 0 && noLock && e.target === canvasEl) { dragging = true; dragDist = 0; }
});
addEventListener('mouseup', () => { if (dragging) { dragging = false; if (dragDist < 5) usePrimary(); } });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => { if (locked()) setSlot((slot + (e.deltaY > 0 ? 1 : 8)) % 9); });

// ---------- 子弹（只负责画出来，命中由服务器判定） ----------
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.15, 12, 12), bulletMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
function tracer(m) {                         // 弹道在命中距离处结束
  const start = new THREE.Vector3(), tgt = new THREE.Vector3(m.o.x + m.d.x * m.len, m.o.y + m.d.y * m.len, m.o.z + m.d.z * m.len);
  if (m.id === myId) flash.getWorldPosition(start); else start.set(m.o.x + m.d.x * .8, m.o.y - .3 + m.d.y * .8, m.o.z + m.d.z * .8);
  const v = tgt.clone().sub(start), dist = v.length(); if (dist < .1) return;
  const b = new THREE.Mesh(bulletGeo, bulletMat); b.position.copy(start);
  b.userData = { vel: v.normalize().multiplyScalar(80), life: dist / 80 };
  scene.add(b); bullets.push(b);
}
function shoot() {
  if (!myAlive || !ws || ws.readyState !== 1) return;
  shots++; sfxShoot(); recoil = 1; flash.visible = true; flashT = .05;
  const d = new THREE.Vector3(); camera.getWorldDirection(d);
  ws.send(JSON.stringify({ t: 'shoot', d: { x: d.x, y: d.y, z: d.z } }));
}

// ---------- 主循环 ----------
const clock = new THREE.Clock(); let netT = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05), sp = 6 * dt;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  let dx = 0, dz = 0;
  if (myAlive) {
    if (keys.w) { dx += fx; dz += fz; } if (keys.s) { dx -= fx; dz -= fz; }
    if (keys.d) { dx += rx; dz += rz; } if (keys.a) { dx -= rx; dz -= rz; }
  }
  const L = Math.hypot(dx, dz) || 1;         // 斜着走不加速
  if (tool === 3 && myAlive) flyStep(dt); else { moveXZ(dx / L * sp, dz / L * sp); stepVertical(dt); }
  camera.position.y = feetY + 3;
  camera.rotation.set(pitch, yaw, myAlive ? (tool === 3 ? bank : 0) : .6);          // 阵亡时视角歪倒
  sky.position.copy(camera.position); updateAim(); updateMobs(dt); updateVoice(dt);

  netT += dt;                                                  // 每 50ms 上报自己的位置和朝向
  if (netT > .05 && ws && ws.readyState === 1 && myId) { netT = 0; ws.send(JSON.stringify({ t: 'move', tool, x: camera.position.x, y: feetY, z: camera.position.z, yaw, pitch })); }
  others.forEach(g => { const t = g.userData.tgt; if (!t) return; const ox = g.position.x, oz = g.position.z; g.position.x += (t.x - g.position.x) * .3; g.position.z += (t.z - g.position.z) * .3; g.position.y += ((t.y || 0) - g.position.y) * .3; g.rotation.y = t.yaw; g.userData.head.rotation.x = (t.pitch || 0) * .7;
    const fl = t.tool === 3; g.userData.body.forEach(c => { c.visible = !fl; }); g.userData.planeM.visible = fl;     // 坐飞机时只显示飞机
    g.userData.planeM.rotation.x = fl ? (t.pitch || 0) : 0; g.userData.prop.rotation.z += fl ? .8 : 0;
    if (!fl) { g.userData.gunM.visible = !t.tool; g.userData.shovelM.visible = t.tool === 1; g.userData.pickM.visible = t.tool === 2; }
    const u = g.userData, v = Math.hypot(g.position.x - ox, g.position.z - oz) / Math.max(dt, .001);   // 按实际移动速度摆动
    u.spd += (Math.min(v, 9) - u.spd) * .2; u.phase += u.spd * dt * 1.1;
    const sw = Math.sin(u.phase) * Math.min(1, u.spd / 6) * .7;
    u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw; u.armL.rotation.x = -sw * .8; });

  const moving = myAlive && (keys.w || keys.a || keys.s || keys.d);   // 枪的摆动与后坐力
  bob += dt * (moving ? 9 : 2); recoil = Math.max(0, recoil - dt * 8);
  flashT -= dt; if (flashT <= 0) flash.visible = false;
  gun.position.set(GUN_REST.x + Math.sin(bob * .5) * (moving ? .012 : .003),
                   GUN_REST.y + Math.abs(Math.sin(bob * .5)) * (moving ? .012 : .002), GUN_REST.z + recoil * .07);
  gun.rotation.x = recoil * .12;
  shovel.position.copy(gun.position); pickaxe.position.copy(gun.position); shovel.rotation.x = pickaxe.rotation.x = -.3 - swing * .8; swing = Math.max(0, swing - dt * 5);

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.position.addScaledVector(b.userData.vel, dt); b.userData.life -= dt;
    if (b.userData.life <= 0) { scene.remove(b); bullets.splice(i, 1); }
  }
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
// ---------- 开始界面 ----------
try { const v = JSON.parse(localStorage.getItem('shooter2')); if (v) { $('nameIn').value = v.name; $('roomIn').value = v.room; $('modeSel').value = v.md; $('countIn').value = v.n; } } catch (e) {}
function startGame() {
  if (location.protocol === 'file:') { $('startMsg').textContent = '请先启动服务器，再用 http://localhost:3000 打开本页'; return; }
  const name = ($('nameIn').value.trim() || '玩家').slice(0, 12), room = ($('roomIn').value.trim() || 'room1').slice(0, 16);
  const md = $('modeSel').value, n = Math.max(1, Math.min(10, parseInt($('countIn').value) || 3));
  try { localStorage.setItem('shooter2', JSON.stringify({ name, room, md, n })); } catch (e) {}
  $('pname').textContent = name; $('startBox').style.display = 'none';
  connect(name, room, md, n, $('mapSel').value, $('protSel').value === '1');
  if ($('voiceChk').checked) enableVoice(); initAudio();
  if (!noLock) { try { const r = canvasEl.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
}
let myAvatar = null;
try { myAvatar = localStorage.getItem('shooterAvatar'); if (myAvatar) { $('avPrev').src = myAvatar; $('avPrev').hidden = false; } } catch (e) {}
$('avIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = 128; c.height = 128;
    const side = Math.min(img.width, img.height);                      // 居中裁成正方形，缩小到 128×128 再发送
    c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 128, 128);
    URL.revokeObjectURL(u); myAvatar = c.toDataURL('image/jpeg', .85);
    try { localStorage.setItem('shooterAvatar', myAvatar); } catch (e) {}
    $('avPrev').src = myAvatar; $('avPrev').hidden = false;
  };
  img.src = u;
});
fetch('/api/maps').then(r => r.json()).then(list => {
  const sel = $('mapSel'); sel.textContent = '';
  list.forEach(m => { const o = document.createElement('option'); o.value = m.id; o.textContent = m.name; sel.appendChild(o); });
}).catch(() => {});
$('startBtn').addEventListener('click', startGame);
['nameIn', 'roomIn', 'countIn'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); }));
loop();
</script></body></html>
